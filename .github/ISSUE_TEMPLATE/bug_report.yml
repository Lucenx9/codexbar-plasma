name: Bug report
description: Report incorrect or broken behavior in the Plasma widget.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Provider login, quota fetching, and config errors belong to the
        [CodexBar CLI](https://github.com/steipete/CodexBar/issues).
        Report suspected vulnerabilities through the
        [security policy](https://github.com/Lucenx9/codexbar-plasma/security/policy)
        instead. Redact accounts, paths, and credentials in anything you paste.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: Describe the actual behavior and how it differs from what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add the widget to the panel with ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: support-report
    attributes:
      label: Diagnostics support report
      description: |
        In widget settings, open Diagnostics → Support report → Collect support report.
        Review Report preview, then use Copy report and paste it here.
        Unknown or unavailable fields are useful too. If Diagnostics cannot open or
        your widget predates this action, enter the widget version, `codexbar --version`,
        Plasma/Qt versions and the configured CLI path manually.
        Add your distribution if it helps reproduce the issue. Review all text for
        personal information before sharing; do not paste raw provider diagnostics.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        QML errors from
        `journalctl --user -u plasma-plasmashell.service --since '10 minutes ago' --no-pager`.
        Include only CodexBar lines.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: The output and screenshots I attached contain no credentials or personal account data.
          required: true
