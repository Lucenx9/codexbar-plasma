name: CI report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed pull-request CI run to report
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  source:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      group: ${{ steps.source.outputs.group }}
    steps:
      - name: Checkout trusted source resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resolve source for automatic and manual reports
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_report.py source

  publish:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only events for the same source PR share a pending slot. Manual dispatch
    # resolves the same group, so it cannot race automatic comment creation.
    concurrency:
      group: ci-report-${{ needs.source.outputs.group }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Test trusted publisher
        run: python3 -m unittest discover -s tests -p test_ci_report.py

      - name: Create repository-scoped bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CODEXBAR_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEXBAR_REVIEW_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Publish or update the bot comment
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPORT_TOKEN: ${{ steps.app-token.outputs.token }}
          CI_REPORT_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: python3 scripts/ci_report.py publish
