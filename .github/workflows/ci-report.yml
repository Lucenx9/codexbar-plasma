name: CI report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed pull-request CI run to report
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

# Serialize updates even when two different PR heads finish close together.
concurrency:
  group: ci-report
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Test trusted publisher
        run: python3 -m unittest discover -s tests -p test_ci_report.py

      - name: Create repository-scoped bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CODEXBAR_REVIEW_APP_ID }}
          private-key: ${{ secrets.CODEXBAR_REVIEW_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Publish or update the bot comment
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPORT_TOKEN: ${{ steps.app-token.outputs.token }}
          CI_REPORT_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: python3 scripts/ci_report.py publish
