name: CI

# Runs the full `make check` on every push/PR to main, and on version tags
# (`vX.Y.Z`) additionally builds the `.plasmoid` and publishes a GitHub Release.
#
# `make check` needs the real KDE/Plasma toolchain: `qmllint` must resolve the
# `org.kde.plasma.*` / `org.kde.kirigami` QML imports and `kpackagetool6` must
# exist. We therefore run inside a KDE neon container (Ubuntu-based, so the
# hardcoded `/usr/lib/qt6/...` paths in the Makefile match) and apt-install the
# few build-only extras the desktop image does not ship.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      # kdeneon/plasma:user resolved on 2026-07-31.
      image: kdeneon/plasma@sha256:3f049a46418324da85a4f2b1d2f36e1b897ede71b1b02954a0b216900fdc8fcc
      # neon `:user` images default to a non-root user; force root so apt works.
      options: --user 0
    permissions:
      contents: read
    steps:
      - name: Install build-only tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            make cmake git ca-certificates gettext jq libxml2-utils shellcheck qt6-declarative-dev-tools

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: make check
        # This image ships qmllint but not the Plasma/Kirigami QML modules, so
        # downgrade the type/import-resolution categories qmllint can't satisfy
        # here. Syntax and JS-level checks still run; full import resolution is
        # covered by `make check` on a Plasma desktop before pushing.
        run: >
          make check
          QMLLINT_FLAGS="--import info --unresolved-type info --missing-property info --unqualified disable"

      - name: make package
        run: make package

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      # kdeneon/plasma:user resolved on 2026-07-31.
      image: kdeneon/plasma@sha256:3f049a46418324da85a4f2b1d2f36e1b897ede71b1b02954a0b216900fdc8fcc
      # neon `:user` images default to a non-root user; force root so apt works.
      options: --user 0
    permissions:
      contents: write
    steps:
      - name: Install build-only tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            make cmake git ca-certificates gettext jq libxml2-utils shellcheck qt6-declarative-dev-tools

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release tag matches metadata
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use vX.Y.Z: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          metadata_version="$(jq -r '.KPlugin.Version // empty' metadata.json)"
          if [[ -z "$metadata_version" || "v${metadata_version}" != "$GITHUB_REF_NAME" ]]; then
            echo "release tag $GITHUB_REF_NAME does not match metadata version $metadata_version" >&2
            exit 1
          fi

      - name: make check
        # This image ships qmllint but not the Plasma/Kirigami QML modules, so
        # downgrade the type/import-resolution categories qmllint can't satisfy
        # here. Syntax and JS-level checks still run; full import resolution is
        # covered by `make check` on a Plasma desktop before pushing.
        run: >
          make check
          QMLLINT_FLAGS="--import info --unresolved-type info --missing-property info --unqualified disable"

      - name: make package
        run: make package

      - name: Publish release
        # v3.0.2 creates a draft, uploads every asset, and only then publishes.
        # Keep repository release immutability enabled so the updater can trust
        # the published tag and asset digests.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/codexbar-plasma.plasmoid
            dist/codexbar-plasma.plasmoid.sha256
          generate_release_notes: true
